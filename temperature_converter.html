<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>Unit Converter</title>
    </head>
        
    <body>
        <header>
            <h1>Unit Converter - Temperature</h1>
            <div class="links">
                <a class="converter" id="leftmost" href="index.html">Main Menu</a>
                <a class="converter" href="length_converter.html">Length Converter</a>
                <a class="converter" href="weight_converter.html">Weight Converter</a>
            </div>
        </header>
        
        <main>
            <section class="core">
                <section class="answer" id="answer-section" hidden>
                    <div class="answer">
                        <h3 class="answer-title">Result of your calculation</h3>
                        <div class="answer-board">
                            <p class="fromValue value" id="convertValue"></p>
                            <p class="unit" id="convertUnit"></p>
                            <p class="equal-sign">=</p>
                            <p class="answerResult value" id="answer"></p>
                            <p class="unit" id="answerUnit"></p>
                        </div>
                    </div>
                    <div class="reset-button">
                        <button id="reset-button" onclick="window.location.reload();">Reset</button>
                    </div>
                </section>

                <section class="main-form" id="main-form">
                    <form action="" class="main-form">
                    <div class="form-div">
                        <label for="input" style="font-weight: bold;">Temperature to convert</label>
                        <div class="form-input">
                            <input name="input" type="text" id="input" pattern="^[0-9]{1,10}" required>
                        </div>
                    </div>
                    
                    <div class="form-div">
                        <label for="from">From</label>
                        <div class="form-input">
                            <select name="from" type="text" id="from">
                                <option value="celsius">Celsius (°C)</option>
                                <option value="fahrenheit">Fahrenheit (°F)</option>
                                <option value="kelvin">Kelvin (K)</option>
                                <option value="rankine">Rankine (°R)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-div">
                        <label for="to">To</label>
                        <div class="form-input">
                            <select name="to" type="text" id="to">
                                <option value="celsius">Celsius (°C)</option>
                                <option value="fahrenheit">Fahrenheit (°F)</option>
                                <option value="kelvin">Kelvin (K)</option>
                                <option value="rankine">Rankine (°R)</option>
                            </select>
                        </div>
                    </div>
            
                    <div class="convert-button">
                        <button id="convert-button" data-mode="2">Convert</button>
                    </div>
                </form>
                </section>
                
            </section>
        </main>  
    </body>
    <script src="script.js"></script>
</html>
