<html>
    <head>
        
    </head>
        <script src="script.js"></script>
        <link rel="stylesheet" href="style.css">
    <body>
        <div class="core">
            <h2>Length</h2>

            <form action="" class="main-form">
                <div class="form-div">
                    <label for="length">Enter the length to convert</label>
                    <div class="form-input">
                        <input name="length" type="text" id="length">
                    </div>
                </div>
                
                <div class="form-div">
                    <label for="from">Unit to convert from</label>
                    <div class="form-input">
                        <input name="from" type="text" id="from">
                    </div>
                </div>
                
                <div class="form-div">
                    <label for="to">Unit to convert to</label>
                    <div class="form-input">
                        <input name="to" type="text" id="to">
                    </div>
                </div>
        
                <div class="convert-button">
                    <button onclick="convert(); return false">Convert</button>
                </div>
            </form>
        </div>    
    </body>

</html>
